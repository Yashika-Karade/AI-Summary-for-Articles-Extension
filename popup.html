<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome extension popup page</title>
    <style>
        body{
           min-width:500px;
           min-height:300px;
           padding:15px;
           background-color:rgb(237, 235, 235)
        }
        #result{
            padding:10px;
            background-color:rgb(234, 229, 229);
            border-radius:5px;
            border:1px solid gray;
            min-height:150px;
            max-height:400px;
            overflow-y:auto;
            white-space:pre-wrap;
            line-height:1.5;

        }
        .loading{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:150px;
        }
        .loader{
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin{
            0%{
                transform:rotate(0deg);
            }
            100%{
                transform:rotate(360deg);
            }

        }
        h2{
            font-size:20px;
            color:black
        }
        #mainBox{
            display:flex;
            gap:10px;
            padding:10px;
            font-family:sans-serif;
        }
        #summarize{
            padding:5px;
            background-color:blue;
            color:white;
            cursor:pointer;
        }
        #copy-btn{
            padding:5px;
            background-color:green;
            color:white;
            cursor:pointer;
        }
    </style>
</head>
<body>
    
     <h2>AI Summary</h2>
     <div id="mainBox">
        <select id="summary-type">
        <option value="brief">Brief</option>
        <option value="detailed">Detailed</option>
        <option value="bullets">Bullet Points</option>
    </select>
    
    <button id="summarize">Summarize</button>
    <button id="copy-btn">Copy</button>
     </div>

    <pre id="result">Select a ype and click Summarize..</pre>

    <script src="popup.js"></script>
</body>
</html>
